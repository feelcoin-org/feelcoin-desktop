[package]
name = "feelcoin-desktop"
version = "0.1.0"
description = "Official Feelcoin desktop wallet"
authors = ["feelcoin-dev <support@feelcoin.org>"]
edition = "2021"
license = "BSD-3-Clause"
homepage = "https://feelcoin.org"
repository = "https://github.com/feelcoin-org/feelcoin-desktop"

[lib]
name = "feelcoin_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
