name: Remove duplicate v1.0.0 source attachments

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-corrected-desktop-source-v1.0.0.yml

permissions:
  contents: write

concurrency:
  group: desktop-v1-source-deduplication
  cancel-in-progress: false

jobs:
  remove-extra-source:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CORRECTED_SOURCE_SHA: f8438a7577c377fcfe38e529688967c5f62ad010
    steps:
      - name: Check GitHub built-in source archives point to corrected source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "feelcoin-org/feelcoin-desktop"
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.0" --jq '.object.sha')"
          test "$tag_sha" = "$CORRECTED_SOURCE_SHA" || { echo "Corrected tag is not present; refusing to delete supplemental archives" >&2; exit 1; }
          echo "Verified automatic Source code archives point to $tag_sha"

      - name: Snapshot published installers and identify exact redundant asset IDs
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.0" > /tmp/feelcoin-before.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/feelcoin-before.json'))
          assert r['tag_name']=='v1.0.0'
          assert r['target_commitish']=='f8438a7577c377fcfe38e529688967c5f62ad010'
          expected={
            'Feelcoin-Desktop-v1.0.0-corrected-source-20261028.zip':686136719,
            'Feelcoin-Desktop-v1.0.0-corrected-source-20261028.zip.sha256':686136811,
          }
          assets={a['name']:a for a in r['assets']}
          for name,aid in expected.items():
            if name in assets:
              assert assets[name]['id']==aid, f'Unexpected asset ID for {name}; fail closed'
          kept={a['name']:[a['id'],a.get('digest')] for a in r['assets'] if a['name'] not in expected}
          assert len(kept)==8 and len([n for n in kept if n.startswith('Feelcoin-v1.0.0-Ubuntu-')])==6
          assert 'Feelcoin.Desktop_1.0.0_x64-setup.exe' in kept
          assert 'SHA256SUMS.txt' in kept
          json.dump(kept,open('/tmp/feelcoin-kept.json','w'))
          print('All original installers and checksums accounted for; redundant assets identified.')
          PY

      - name: Remove only the two redundant manual source attachments
        shell: bash
        run: |
          set -euo pipefail
          for item in \
            "686136719:Feelcoin-Desktop-v1.0.0-corrected-source-20261028.zip" \
            "686136811:Feelcoin-Desktop-v1.0.0-corrected-source-20261028.zip.sha256"; do
            id="${item%%:*}"
            name="${item#*:}"
            actual="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.0" --jq ".assets[] | select(.name == \"$name\") | .id")"
            if [ -z "$actual" ]; then
              echo "Already absent: $name"
            elif [ "$actual" = "$id" ]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id" >/dev/null
              echo "Removed redundant attachment: $name"
            else
              echo "Asset identity mismatch for $name; refusing" >&2; exit 1
            fi
          done

      - name: Verify exactly the original installer assets remain unchanged
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.0" > /tmp/feelcoin-after.json
          python3 - <<'PY'
          import json
          before=json.load(open('/tmp/feelcoin-kept.json'))
          after=json.load(open('/tmp/feelcoin-after.json'))
          current={a['name']:[a['id'],a.get('digest')] for a in after['assets']}
          assert current==before, 'Asset list/digests changed unexpectedly'
          assert after['target_commitish']=='f8438a7577c377fcfe38e529688967c5f62ad010'
          print('SUCCESS: six Linux packages, Windows installer, original SHA256SUMS preserved.')
          print('Only automatic corrected Source code (zip/tar.gz) archives remain.')
          PY
