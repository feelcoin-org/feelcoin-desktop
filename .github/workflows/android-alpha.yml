name: Build Android Alpha APK
on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-wallet
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'docs/ANDROID_ALPHA.md'
      - '.github/workflows/android-alpha.yml'
      - 'package.json'
permissions:
  contents: read
jobs:
  android:
    name: ARM64 Android test APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
      - name: Prepare Android NDK
        run: |
          if [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          else
            sdkmanager --install "ndk;27.2.12479018"
            echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          fi
      - name: Install JavaScript dependencies
        run: npm install
      - name: Verify TypeScript and UI
        run: npm run build
      - name: Initialize Android target
        run: npx tauri android init --ci
      - name: Build ARM64 debug APK
        run: npx tauri android build --debug --apk --target aarch64
      - name: Verify APK artifact exists
        run: find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print -quit | grep -q apk
      - name: Upload APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: feelcoin-mining-watch-android-arm64-alpha
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
