name: Feelcoin Desktop v0.3.0 Candidate - No Windows Core Bundled

on:
  push:
    branches:
      - release/stable-v0.3.0-candidate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Stable candidate ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            bundles: nsis
          - platform: linux-amd64
            os: ubuntu-22.04
            bundles: deb,appimage
    steps:
      - uses: actions/checkout@v4
      - name: Remove all bundled Feelcoin Core files from Windows build
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # The release source was derived from a Linux build; do not carry
          # its binaries into a Windows installation.
          find src-tauri/resources/bin src-tauri/resources/lib -maxdepth 1 -type f \\( -name 'feelcoind*' -o -name 'feelcoin-wallet-rpc*' -o -name '*.so*' \\) -print -delete
          if find src-tauri/resources/bin src-tauri/resources/lib -type f \\( -name 'feelcoind*' -o -name 'feelcoin-wallet-rpc*' -o -name '*.so*' \\) | grep -q .; then
            echo "STOP: Core files remain in Windows candidate checkout"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript and frontend
        run: npm run build
      - name: Verify source versions agree
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          for (const p of ['package.json', 'src-tauri/tauri.conf.json']) {
            if (JSON.parse(fs.readFileSync(p, 'utf8')).version !== '0.3.0') throw Error(p + ': wrong release version');
          }
          const toml = fs.readFileSync('src-tauri/Cargo.toml','utf8');
          if (!/^version = "0.3.0"$/m.test(toml)) throw Error('Cargo.toml: wrong release version');
          NODE
      - name: Check backend
        working-directory: src-tauri
        run: cargo check
      - name: Verify native binaries and exclude other OS binaries
        shell: bash
        run: |
          set -euo pipefail
          root="src-tauri/resources"
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Windows ships ONLY the graphical wallet application. Core is external.
            if find "$root/bin" "$root/lib" -type f \\( -name 'feelcoind*' -o -name 'feelcoin-wallet-rpc*' -o -name '*.so*' \\) | grep -q .; then
              echo "ERROR: Prohibited native Core component found in Windows bundle input"
              exit 1
            fi
          else
            test -s "$root/bin/feelcoind"
            test -s "$root/bin/feelcoin-wallet-rpc"
            test ! -e "$root/bin/feelcoind.exe"
            test ! -e "$root/bin/feelcoin-wallet-rpc.exe"
            for binary in "$root/bin/feelcoind" "$root/bin/feelcoin-wallet-rpc"; do
              test "$(od -An -tx1 -N4 "$binary" | tr -d ' \n')" = "7f454c46" || {
                echo "ERROR: Linux component is not an ELF executable: $binary"
                exit 1
              }
            done
          fi

      - name: Set explicit platform-specific bundled resources
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = 'src-tauri/tauri.conf.json';
          const config = JSON.parse(fs.readFileSync(file, 'utf8'));
          config.bundle.resources = process.platform === 'win32'
            ? [] // Windows Core is not compiled or bundled
            : ['resources/bin/feelcoind', 'resources/bin/feelcoin-wallet-rpc', 'resources/lib/libcom_err.so.2'];
          fs.writeFileSync(file, JSON.stringify(config, null, 2) + '\n');
          console.log(process.platform, config.bundle.resources);
          NODE

      - name: Generate platform icons
        run: npx tauri icon public/feelcoin-logo.png --fit contain
      - name: Use supported icon files
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const file='src-tauri/tauri.conf.json';
          const config=JSON.parse(fs.readFileSync(file,'utf8'));
          config.bundle.icon=['icons/32x32.png','icons/128x128.png','icons/128x128@2x.png','icons/icon.ico'];
          fs.writeFileSync(file,JSON.stringify(config,null,2)+'\n');
          NODE
      - name: Build native v0.3.0 candidate installers
        uses: tauri-apps/tauri-action@v0
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        with:
          args: --bundles ${{ matrix.bundles }}
      - name: Audit Windows installer for excluded native Core
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tool = Join-Path $env:ProgramFiles '7-Zip\\7z.exe'
          if (!(Test-Path $tool)) { throw '7-Zip inspection utility missing' }
          $inst = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File)
          if ($inst.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          $listing = & $tool l -slt $inst[0].FullName | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect Windows installer' }
          if ($listing -match '(?i)feelcoind(?:\\.exe)?|feelcoin-wallet-rpc(?:\\.exe)?|libcom_err\\.so|\\.so\\.\\d') {
            throw 'Prohibited bundled Core executable or Linux shared library detected'
          }
          'PASS: Windows candidate does not contain bundled Feelcoin Core.'
      - name: Upload verified platform release candidates
        uses: actions/upload-artifact@v4
        with:
          name: feelcoin-wallet-v0.3.0-rc-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: error
          retention-days: 14
