name: Update Alpha Release Notes
on:
  push:
    branches: [alpha-dev]
    paths:
      - .github/workflows/update-alpha-release-notes.yml
      - RELEASE_NOTES_ALPHA.md
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Update public release description
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v0.1.0-alpha --repo "${{ github.repository }}" --title "Feelcoin Desktop Wallet v0.1.0 Alpha — Windows & Linux" --notes-file RELEASE_NOTES_ALPHA.md
