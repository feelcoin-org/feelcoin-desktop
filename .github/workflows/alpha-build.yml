name: Alpha Builds

on:
  push:
    branches: ["alpha-dev"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-alpha:
    name: Linux Alpha
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Feelcoin Desktop
        uses: actions/checkout@v5

      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            file \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Fetch verified Feelcoin Core v0.2.1
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/feelcoin-org/feelcoin/releases/download/v0.2.1/feelcoin-v0.2.1-linux-x64.tar.gz"
          curl -L --fail --retry 3 "$url" -o /tmp/feelcoin-core.tar.gz
          echo "162b89f887e9df7572447c0d650fd8ed97f494cf97ccc17a9477ae214bf5adb1  /tmp/feelcoin-core.tar.gz" | sha256sum -c -
          rm -rf /tmp/feelcoin-core
          mkdir -p /tmp/feelcoin-core src-tauri/resources/bin
          tar -xzf /tmp/feelcoin-core.tar.gz -C /tmp/feelcoin-core
          daemon="$(find /tmp/feelcoin-core -type f -name feelcoind -print -quit)"
          wallet_rpc="$(find /tmp/feelcoin-core -type f -name feelcoin-wallet-rpc -print -quit)"
          test -n "$daemon"
          test -n "$wallet_rpc"
          install -m 0755 "$daemon" src-tauri/resources/bin/feelcoind
          install -m 0755 "$wallet_rpc" src-tauri/resources/bin/feelcoin-wallet-rpc
          sha256sum src-tauri/resources/bin/feelcoind src-tauri/resources/bin/feelcoin-wallet-rpc

      - name: Generate application icons
        run: npx tauri icon public/feelcoin-logo.png

      - name: Build Linux installers
        run: npx tauri build --bundles deb,appimage

      - name: Create Linux checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p alpha-output
          find src-tauri/target/release/bundle -type f \
            \( -name "*.deb" -o -name "*.AppImage" \) \
            -exec cp {} alpha-output/ \;
          cd alpha-output
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Linux Alpha
        uses: actions/upload-artifact@v7
        with:
          name: Feelcoin-Desktop-Alpha-Linux-x64
          path: alpha-output/*
          if-no-files-found: error

  windows-alpha:
    name: Windows Alpha
    runs-on: windows-2025
    steps:
      - name: Checkout Feelcoin Desktop
        uses: actions/checkout@v5

      - name: Setup MSYS2 for Feelcoin Core
        uses: msys2/setup-msys2@v2
        with:
          update: true
          cache: true
          install: >-
            mingw-w64-x86_64-toolchain
            make
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zeromq
            mingw-w64-x86_64-libsodium
            mingw-w64-x86_64-hidapi
            mingw-w64-x86_64-protobuf-c
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-unbound
            git

      - name: Build Feelcoin Core v0.2.1 for Windows
        shell: msys2 {0}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.2.1 https://github.com/feelcoin-org/feelcoin.git core
          cd core
          make release-static-win64 -j2
          test -f build/release/bin/feelcoind.exe
          test -f build/release/bin/feelcoin-wallet-rpc.exe
          mkdir -p ../src-tauri/resources/bin
          cp build/release/bin/feelcoind.exe ../src-tauri/resources/bin/feelcoind.exe
          cp build/release/bin/feelcoin-wallet-rpc.exe ../src-tauri/resources/bin/feelcoin-wallet-rpc.exe
          sha256sum ../src-tauri/resources/bin/feelcoind.exe ../src-tauri/resources/bin/feelcoin-wallet-rpc.exe

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        shell: pwsh
        run: npm install

      - name: Generate application icons
        shell: pwsh
        run: npx tauri icon public/feelcoin-logo.png

      - name: Build Windows installer
        shell: pwsh
        run: npx tauri build --bundles nsis

      - name: Create Windows checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path alpha-output | Out-Null
          Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" |
            Copy-Item -Destination "alpha-output"
          $files = Get-ChildItem -Path "alpha-output" -File
          if ($files.Count -eq 0) { throw "No Windows installer found" }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Encoding ascii "alpha-output/SHA256SUMS.txt"
          Get-Content "alpha-output/SHA256SUMS.txt"

      - name: Upload Windows Alpha
        uses: actions/upload-artifact@v7
        with:
          name: Feelcoin-Desktop-Alpha-Windows-x64
          path: alpha-output/*
          if-no-files-found: error
